server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: AI_Interview_Coach_backend
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.interview.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.interview: debug
    org.springframework: info

# Sa-Token 配置
sa-token:
  # Token 名称
  token-name: Authorization
  # Token 前缀
  token-prefix: Bearer
  # Token 有效期（7天，单位秒）
  timeout: 604800
  # Token 最低活跃频率（-1表示不限制）
  active-timeout: -1
  # 是否允许同一账号多地同时登录
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个Token
  is-share: false
  # Token 风格（uuid/simple-uuid/random-32/random-64/random-128）
  token-style: uuid
  # 是否输出操作日志
  is-log: false

# 阿里云 OSS 配置
aliyun:
  oss:
    endpoint: oss-cn-beijing.aliyuncs.com
    access-key-id: YOUR_ACCESS_KEY_ID
    access-key-secret: YOUR_ACCESS_KEY_SECRET
    bucket-name: ai-interview-c0ach
    url-prefix: https://ai-interview-c0ach.oss-cn-beijing.aliyuncs.com